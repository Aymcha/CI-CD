version: 2.1

jobs:
  build-test:
    docker:
      - image: circleci/node:14

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      - run:
          name: Run tests
          command: npm run test

      - run:
          name: Build project
          command: npm run build

      # 🔐 Security audit — fail only for CRITICAL vulnerabilities
      - run:
          name: Security audit (critical only)
          command: |
            echo "Running npm audit for CRITICAL vulnerabilities only..."
            npm audit --audit-level=critical

workflows:
  node-tests:
    jobs:
      - build-test